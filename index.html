<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Crystal Judy: approved identity and positioning. -->
    <title>Crystal Judy | Digital Marketing & Creative Systems Specialist</title>
    <meta name="description" content="Digital marketing, content, funnels, CRM and automation support for service providers, entrepreneurs and growing brands." />
    <meta name="author" content="Crystal Judy" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F4ED" />
    <!-- TODO: Add the approved production/canonical URL. -->

    <!-- TODO: Add Crystal’s final favicon; current asset is the template icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crystal Judy" />
    <meta property="og:title" content="Crystal Judy | Digital Marketing & Creative Systems Specialist" />
    <meta property="og:description" content="Creative execution, campaigns, funnels and marketing systems for brands ready to turn ideas into action." />
    <!-- TODO: Add the approved production URL to og:url. -->
    <!-- TODO: Add the approved social share image (absolute URL). -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
